 body{margin:0;font-family:system-ui,sans-serif;background:#EAF6FA;color:#12495A}

 .lab{position:absolute;left:8px;transform:translateY(-50%);display:flex;align-items:center;gap:6px;

   font-weight:800;font-size:14px;box-shadow:0 3px 0 #175A70;pointer-events:auto}
 .lab.active{border-color:#12495A;background:#1F7690;color:#fff;box-shadow:0 3px 0 #12495A}
 .cnt{background:#C9EAF3;color:#175A70;border-radius:999px;padding:0 6px;font-size:11px}
 .lab.active .cnt{background:rgba(255,255,255,.25);color:#fff}
