<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#0b1220"/>
  
    <rect x="60" y="60" width="1080" height="680" fill="none" stroke="#94a3b8" stroke-width="6"/>
    <!-- ステージ -->
    
    <rect x="120" y="100" width="960" height="150" fill="#0f2033" stroke="#64748b" stroke-width="3"/>
    <text x="600" y="169" fill="#cbd5e1" font-size="26" font-weight="700"
          text-anchor="middle" font-family="sans-serif">ステージ</text>
    <text x="600" y="199" fill="#64748b" font-size="19" text-anchor="middle" font-family="sans-serif">発表・演奏はこちら</text>
    <!-- アリーナ -->
    
    <rect x="120" y="290" width="960" height="320" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
    <text x="600" y="444" fill="#cbd5e1" font-size="26" font-weight="700"
          text-anchor="middle" font-family="sans-serif">アリーナ</text>
    <text x="600" y="474" fill="#64748b" font-size="19" text-anchor="middle" font-family="sans-serif">観覧スペース</text>
    <!-- コートのライン（雰囲気づけ） -->
    <rect x="200" y="330" width="800" height="240" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
    <line x1="600" y1="330" x2="600" y2="570" stroke="#475569" stroke-width="2" stroke-dasharray="10 8"/>
    <!-- 入口・用具室 -->
    
    <rect x="120" y="640" width="380" height="70" fill="#0f2033" stroke="#64748b" stroke-width="3"/>
    <text x="310" y="682" fill="#cbd5e1" font-size="26" font-weight="700"
          text-anchor="middle" font-family="sans-serif">入口</text>
    
    
    <rect x="520" y="640" width="260" height="70" fill="#0f2033" stroke="#64748b" stroke-width="3"/>
    <text x="650" y="682" fill="#cbd5e1" font-size="26" font-weight="700"
          text-anchor="middle" font-family="sans-serif">WC</text>
    
    
    <rect x="800" y="640" width="280" height="70" fill="#0f2033" stroke="#64748b" stroke-width="3"/>
    <text x="940" y="682" fill="#cbd5e1" font-size="26" font-weight="700"
          text-anchor="middle" font-family="sans-serif">用具室</text>
    
    <g transform="translate(1110, 110)">
      <circle r="30" fill="none" stroke="#64748b" stroke-width="2"/>
      <path d="M 0 -20 L 8 12 L 0 5 L -8 12 Z" fill="#cbd5e1"/>
      <text x="0" y="-32" fill="#64748b" font-size="17" text-anchor="middle" font-family="sans-serif">N</text>
    </g>
    <text x="30" y="782" fill="#cbd5e1" font-size="26" font-weight="700" font-family="sans-serif">体育館</text>
  <text x="1180" y="782" fill="#64748b" font-size="20" text-anchor="end"
        font-family="sans-serif">体育館（ダミー図面）</text>
</svg>